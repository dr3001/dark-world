[package]
name = "darkworld-launcher"
version = "1.0.0"
description = "Dark World Game Launcher"
authors = ["Zorion Labs"]
edition = "2021"

[lib]
name = "darkworld_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
zip = "2"
flate2 = "1"
tar = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[profile.release]
strip = true
lto = true
